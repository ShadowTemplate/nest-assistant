# Manifest for the SYNTHETIC corpus.
#
# This file is the template for `data/manifest.yaml`, which TEAM 1 produces in
# task W1-1.1 from the real Nest documents. Same shape, real content.
#
# The `tier` field is the most important line in this file. It is a policy
# judgment wearing the costume of a data-entry task: it decides who is allowed to
# see each document, and INGEST propagates it into every chunk. Get it wrong here
# and no downstream code can save you.
#
# The two PUBLIC fixtures (prezzi-2026.md, ammissioni.md) summarise information
# Nest already publishes — the Bando and the brochures — in our own words, with
# the real values, so the same eval questions work on fixtures/ and on data/.
# Everything at resident and staff tier is INVENTED: no real names, no real
# rules, no real procedures. The repository never holds anything of Nest's that
# Nest has not already made public.

documents:
  - filename: prezzi-2026.md
    title: Rette e condizioni 2026/2027
    format: markdown
    lang: it
    tier: public
    updated: 2026-06-27
    owner: segreteria
    answers: >
      Retta annuale e semestrale per tipo di camera, cosa è incluso, caparra,
      riduzioni, sostegni al merito, mobilità e laureandi.

  - filename: ammissioni.md
    title: Requisiti e procedura di ammissione
    format: markdown
    lang: it
    tier: public
    updated: 2026-06-27
    owner: direzione
    answers: >
      Requisiti di merito, iter di ammissione, colloquio, documenti e
      scadenze, obiettivi per la conferma, studenti internazionali.

  - filename: regolamento-casa.md
    title: Regolamento interno della residenza
    format: markdown
    lang: it
    tier: resident
    updated: 2026-09-01
    owner: direzione
    answers: >
      Orari di silenzio, ospiti, spazi comuni, pulizie, sanzioni.

  - filename: calendario-attivita.md
    title: Attività e vita in residenza — autunno 2026
    format: markdown
    lang: it
    tier: resident
    updated: 2026-09-20
    owner: staff attività
    answers: >
      Quali attività ci sono, quando, dove, come iscriversi.

  - filename: procedure-segreteria.md
    title: Procedure operative della segreteria
    format: markdown
    lang: it
    tier: staff
    updated: 2026-06-30
    owner: segreteria
    answers: >
      Gestione morosità, cambio camera, danni, uscita anticipata.
      Uso interno.
