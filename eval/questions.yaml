  expected_sources: [prezzi-2026.md, Bando_NEST_College_Trento_2026-2027.pdf, NEST_COLLEGE_Trento_international_2026-2027.pdf]
  expected_answer: "10.450"
  source: document
  notes: "Retta annuale. Una risposta che dà solo la retta semestrale (5.700) è incompleta."

