# The evaluation set. TEAM 5 owns this file (task W1-5.1).
#
# What is here now is a SEED — about thirty questions written from Nest's real
# documents (the PDFs in data/) and from the fixtures, so that `make eval`
# produces a number from minute zero. It is not the real set. The real set is
# 60–100 questions that real people actually ask, and building it is the most
# valuable thing anyone does on the day.
#
# Fields
#   id                stable, referenced in scorecards over time
#   question          exactly as a person would type it, typos and all
#   tier              who is asking: public | resident | staff
#   expect            "answer" or "refusal"
#   expected_sources  filenames a human would have cited. List every file that
#                     holds the fact — in data/ AND in fixtures/ — a hit on any
#                     of them counts.
#   expected_answer   the key fact the answer must contain. A fact, never a
#                     quoted paragraph, and NEVER a credential (see q018).
#   corpus            optional: "data" or "fixtures" if the question only makes
#                     sense on one of them. Absent = valid on both. The harness
#                     skips questions that do not match the corpus in use.
#   source            where this question came from — staff | resident | document
#   notes             anything a future reader needs to know
#
# `source` is not paperwork. A set written by residents over-represents what
# residents care about and under-represents what worried parents ask. Recording
# the provenance is what lets eval/README.md say so honestly.
#
# Real document filenames, for reference:
#   Bando_NEST_College_Trento_2026-2027.pdf            admission call, fees (IT)
#   NEST_COLLEGE_Trento_international_2026-2027.pdf    brochure with fees (EN)
#   Proposta_NEST_College_Trento_2026-2027.pdf         brochure (IT)
#   SALVASTUDENTE_COLLEGE_26.pdf                       residents' guide (IT)
#   STUDENTSAVER_COLLEGE_26.pdf                        residents' guide (EN)
#   INFOGRAFICA_Esperienza_NEST_26_27.pdf              training path and dates
#   camere-residenti.txt                               room list — SYNTHETIC, staff

# --- Public: prices and admissions. What parents ask. ----------------------
# The public fixtures carry the same facts as the real documents, so these
# questions are valid on both corpora.

- id: q001
  question: "Quanto costa una camera singola?"
