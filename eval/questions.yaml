# The evaluation set. TEAM 5 owns this file (task W1-5.1).
#
# What is here now is a SEED — about thirty questions written from Nest's real
# documents (the PDFs in data/) and from the fixtures, so that `make eval`
# produces a number from minute zero. It is not the real set. The real set is
# 60–100 questions that real people actually ask, and building it is the most
# valuable thing anyone does on the day.
#
# Fields
#   id                stable, referenced in scorecards over time
#   question          exactly as a person would type it, typos and all
#   tier              who is asking: public | resident | staff
#   expect            "answer" or "refusal"
#   expected_sources  filenames a human would have cited. List every file that
#                     holds the fact — in data/ AND in fixtures/ — a hit on any
#                     of them counts.
#   expected_answer   the key fact the answer must contain. A fact, never a
#                     quoted paragraph, and NEVER a credential (see q018).
#   corpus            optional: "data" or "fixtures" if the question only makes
#                     sense on one of them. Absent = valid on both. The harness
#                     skips questions that do not match the corpus in use.
#   source            where this question came from — staff | resident | document
#   notes             anything a future reader needs to know
#
# `source` is not paperwork. A set written by residents over-represents what
# residents care about and under-represents what worried parents ask. Recording
# the provenance is what lets eval/README.md say so honestly.
#
# Real document filenames, for reference:
#   Bando_NEST_College_Trento_2026-2027.pdf            admission call, fees (IT)
#   NEST_COLLEGE_Trento_international_2026-2027.pdf    brochure with fees (EN)
#   Proposta_NEST_College_Trento_2026-2027.pdf         brochure (IT)
#   SALVASTUDENTE_COLLEGE_26.pdf                       residents' guide (IT)
#   STUDENTSAVER_COLLEGE_26.pdf                        residents' guide (EN)
#   INFOGRAFICA_Esperienza_NEST_26_27.pdf              training path and dates
#   camere-residenti.txt                               room list — SYNTHETIC, staff

# --- Public: prices and admissions. What parents ask. ----------------------
# The public fixtures carry the same facts as the real documents, so these
# questions are valid on both corpora.

- id: q001
  question: "Quanto costa una camera singola?"
  tier: public
  expect: answer
  expected_sources: [prezzi-2026.md, Bando_NEST_College_Trento_2026-2027.pdf, NEST_COLLEGE_Trento_international_2026-2027.pdf]
  expected_answer: "10.450"
  source: document
  notes: "Retta annuale. Una risposta che dà solo la retta semestrale (5.700) è incompleta."

- id: q002
  question: "La doppia quanto viene per un semestre?"
  tier: public
  expect: answer
  expected_sources: [prezzi-2026.md, Bando_NEST_College_Trento_2026-2027.pdf, NEST_COLLEGE_Trento_international_2026-2027.pdf]
  expected_answer: "4.500"
  source: document

- id: q003
  question: "Nella retta sono compresi i pasti?"
  tier: public
  expect: answer
  expected_sources: [prezzi-2026.md, Bando_NEST_College_Trento_2026-2027.pdf, NEST_COLLEGE_Trento_international_2026-2027.pdf]
  expected_answer: "colazione"
  source: document
  notes: "Colazione e cena, solo dal lunedì al venerdì. Domanda tipica di un genitore."

- id: q004
  question: "Quanto è la caparra?"
  tier: public
  expect: answer
  expected_sources: [prezzi-2026.md, NEST_COLLEGE_Trento_international_2026-2027.pdf]
  expected_answer: "1.500"
  source: document
  notes: >
    Solo la brochure internazionale (in inglese) cita la caparra; il Bando no.
    Un buon test del retrieval cross-lingua: domanda in italiano, fonte in inglese.

- id: q005
  question: "Ho due figli che vorrebbero venire al NEST, c'è uno sconto?"
  tier: public
  expect: answer
  expected_sources: [prezzi-2026.md, Bando_NEST_College_Trento_2026-2027.pdf]
  expected_answer: "mensilità"
  source: document
  notes: "Sconto pari alla quota alloggio di una mensilità, dal secondo figlio."

- id: q006
  question: "Esiste la camera tripla? Quanto costa?"
  tier: public
  expect: answer
  expected_sources: [prezzi-2026.md, Bando_NEST_College_Trento_2026-2027.pdf]
  expected_answer: "7.150"
  source: document
  notes: "La brochure internazionale non elenca la tripla. Il Bando sì: offerta limitata."

- id: q007
  question: "Che media serve per essere ammessi al secondo anno?"
  tier: public
  expect: answer
  expected_sources: [ammissioni.md, Bando_NEST_College_Trento_2026-2027.pdf]
  expected_answer: "24"
  source: document
  notes: >
    24/30 e almeno il 50% dei CFU. Attenzione: la tabella delle medie per area
    (25–27) riguarda la CONFERMA per l'anno dopo, non l'ammissione. Confonderle
    è l'errore più probabile.

- id: q008
  question: "Entro quando devo consegnare i documenti per l'ammissione?"
  tier: public
  expect: answer
  expected_sources: [ammissioni.md, Bando_NEST_College_Trento_2026-2027.pdf]
  expected_answer: "31 luglio"
  source: document

- id: q009
  question: "il colloquio di ammissione si puo fare online?"
  tier: public
  expect: answer
  expected_sources: [ammissioni.md, Bando_NEST_College_Trento_2026-2027.pdf]
  expected_answer: "online"
  source: document
  notes: "Scritta senza accenti né maiuscola, come la scriverebbe qualcuno dal telefono."

- id: q010
  question: "Quanto vale il sostegno al merito?"
  tier: public
  expect: answer
  expected_sources: [prezzi-2026.md, Bando_NEST_College_Trento_2026-2027.pdf, Proposta_NEST_College_Trento_2026-2027.pdf]
  expected_answer: "2.250"
  source: document
  notes: >
    Una risposta completa dice anche che per il 2026/2027 il concorso è già
    chiuso. Dare la cifra senza questo dettaglio illude chi chiede.

# --- Public: questions the corpus cannot answer. These must be REFUSED. -----
# A system that answers these is worse than one that answers nothing: it has
# learned to sound confident about things it does not know.

- id: q011
  question: "Quando mi restituite la caparra?"
  tier: public
  expect: refusal
  expected_sources: []
  source: document
  notes: >
    Nessun documento lo dice. La tentazione del modello è inventare "entro 30
    giorni". Sbagliare questa risposta costa più che non darla. Vedi W1-3.2.

- id: q012
  question: "Si può pagare la retta a rate?"
  tier: public
  expect: refusal
  expected_sources: []
  source: document
  notes: "Il corpus non parla di modalità di pagamento. Va chiesto alla segreteria."

- id: q013
  question: "Quanto costerà la singola nel 2028?"
  tier: public
  expect: refusal
  expected_sources: []
  source: document
  notes: "Nessuno lo sa. Nemmeno il modello. Soprattutto il modello."

